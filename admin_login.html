<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Digital Lost & Found</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<nav class="navbar">

    <div class="nav-inner">

        <a href="/login" class="brand">

            <div class="brand-icon">
                ⌖
            </div>

            <div class="brand-text">
                Digital Lost <span>& Found</span>
            </div>

        </a>

    </div>

</nav>


<main class="auth-page">

    <div class="auth-card">


        <div class="auth-logo">
            AD
        </div>


        <h1>
            Admin Portal
        </h1>


        <p class="subtitle">
            Administrator access to the
            Lost & Found System.
        </p>


        {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST"
              action="/admin-login">


            <div class="form-group">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Admin Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Admin Login
            </button>


        </form>


        <div class="auth-footer">

            <a href="/login">
                ← User Login
            </a>

        </div>


    </div>

</main>


<footer>
    Digital Lost & Found System
</footer>


</body>

</html>
